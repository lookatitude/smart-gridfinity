<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Plan of a tile three rows deep, seen from above. Each row has one long board with four groups of four pins. The board of the front row is wider at the left and holds the radio module, the converter and the switches. The boards of rows two and three are narrow strips with a wider end holding a switch chip. A short flat cable joins each row to the next at the left. Leads from the edge connectors go to the front row's board."><title>Plan of a tile three rows deep, seen from above. Each row has one long board with four groups of four pins. The board of the front row is wider at the left and holds the radio module, the converter and the switches. The boards of rows two and three are narrow strips with a wider end holding a switch chip. A short flat cable joins each row to the next at the left. Leads from the edge connectors go to the front row's board.</title><style>text{font-family:"Inter","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;font-size:13px;fill:#e9eef3}.small{font-size:12.5px;fill:#9aa8b6}.lead{stroke:#9aa8b6;stroke-width:1;fill:none}</style><rect x="0" y="0" width="760" height="380" fill="#131a22"/>
